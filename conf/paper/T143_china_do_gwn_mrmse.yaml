# R4 tasks-143: China DO-GWN matched control under RMSE-based checkpointing
meta:
  paper_slug: "t143_china_do_gwn_mrmse"

data:
  lag: 12
  horizon: 12

train:
  year_split: true
  stride_horizon: true
  prefix_boundary: true
  epochs: 200
  early_stop: true
  early_stop_patience: 20
  amp: true
  debug: false
  batch_size: 192
  accumulate_steps: 1
  optimizer: adam
  scheduler: plateau
  lr_init: 0.003
  weight_decay: 0.0
  monitor_metric: val_rmse
  early_stop_metric: val_rmse

physics:
  use_pinn: false
  use_drivers: false
  use_drivers_input: false

